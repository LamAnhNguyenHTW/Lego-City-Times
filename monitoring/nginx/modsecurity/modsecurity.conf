# Use the CRS recommended defaults, then override below.
Include /etc/modsecurity.d/modsecurity.conf-recommended

# Enable blocking mode.
SecRuleEngine On

# Reduce overhead by not inspecting response bodies.
SecResponseBodyAccess Off

# Keep audit logs in nginx log directory (tmpfs mounted).
SecAuditLog /var/log/nginx/modsec_audit.log
SecAuditLogFormat JSON
SecAuditLogParts ABIJDEFHZ
SecAuditEngine RelevantOnly

# Optional size limits (10 MB).
SecRequestBodyLimit 10485760
SecRequestBodyNoFilesLimit 10485760

# Load OWASP CRS.
Include /etc/modsecurity.d/owasp-crs/crs-setup.conf
Include /etc/modsecurity.d/owasp-crs/rules/*.conf
