events {
    worker_connections 1024;
}

http {
    client_max_body_size 10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    upstream content_service {
        server content-service:8080;
    }

    upstream search_service {
        least_conn;
        server search-service:8080;
    }

    upstream frontend_service {
        least_conn;
        server frontend:3000;
    }

    # HTTP → HTTPS Redirect
    server {
        listen 80;
        server_name _;

        # Interner Health-Endpunkt für den Docker-Healthcheck
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        # Docker-DNS für dynamische Auflösung der Frontend-Replicas
        resolver 127.0.0.11 valid=10s ipv6=off;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Search Service API
        location /api/v1/search {
            proxy_pass         http://search_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Such-Index-Endpunkt — Daten verarbeitender Web-Endpunkt (Lasttests)
        location /internal/search {
            proxy_pass         http://search_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 120s;
        }

        # Content Service API
        location /api/v1 {
            proxy_pass         http://content_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 60s;
        }

        # Static uploads & other backend paths
        location ~ ^/(uploads|swagger-ui|api-docs|actuator) {
            proxy_pass         http://content_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Next.js Frontend
        location / {
            proxy_pass         http://frontend_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Stub-Status für nginx-prometheus-exporter
        location /stub_status {
            stub_status on;
            allow 172.0.0.0/8;   # Docker-Netzwerk
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
