events {
    worker_connections 1024;
}

http {
    client_max_body_size 10m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;

    upstream content_service {
        server content-service:8080;
    }

    upstream search_service {
        server search-service:8080;
    }

    upstream frontend_service {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name _;

        # Search Service API
        location /api/v1/search {
            proxy_pass         http://search_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Content Service API
        location /api/v1 {
            proxy_pass         http://content_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 60s;
        }

        # Static uploads & other backend paths
        location ~ ^/(uploads|swagger-ui|api-docs|actuator) {
            proxy_pass         http://content_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Next.js Frontend
        location / {
            proxy_pass         http://frontend_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Stub-Status für nginx-prometheus-exporter
        location /stub_status {
            stub_status on;
            allow 172.0.0.0/8;   # Docker-Netzwerk
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
