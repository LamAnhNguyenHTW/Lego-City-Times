global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"
  routes:
    - match:
        severity: critical
      receiver: "default"
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: "default"
    # Hier Slack / E-Mail eintragen:
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/services/XXX"
    #     channel: "#alerts"
    #     title: "{{ .GroupLabels.alertname }}"
    #     text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
    # email_configs:
    #   - to: "ops@legocitytimes.lc"
    #     from: "alertmanager@legocitytimes.lc"
    #     smarthost: "smtp.example.com:587"

inhibit_rules:
  # Critical unterdrückt Warning für dieselbe Ressource
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "container"]
