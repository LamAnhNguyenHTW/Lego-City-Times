spring.application.name=search-service

server.port=8080



spring.elasticsearch.uris=http://localhost:9200

spring.elasticsearch.connection-timeout=10s

spring.elasticsearch.socket-timeout=120s



springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.path=/swagger-ui.html



management.endpoints.web.exposure.include=health,info,prometheus,metrics

management.endpoint.health.show-details=always

management.metrics.tags.application=${spring.application.name}

management.metrics.distribution.percentiles-histogram.http.server.requests=true

management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99



app.elasticsearch.bootstrap-index=true



app.indexing.core-pool-size=8

app.indexing.max-pool-size=16

app.indexing.queue-capacity=300


# Tomcat limits to prevent OOM / connection resets under extreme concurrency

server.tomcat.threads.max=20

server.tomcat.max-connections=40

server.tomcat.accept-count=1000