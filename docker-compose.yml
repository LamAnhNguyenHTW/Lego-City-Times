services:

  # ── Datenbank ──────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: legocitytimes-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: legocitytimes-postgres
    environment:
      POSTGRES_DB: legocitytimes
      POSTGRES_USER: legocity
      POSTGRES_PASSWORD: legocity
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legocity -d legocitytimes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Automatisiertes DB-Backup ──────────────────────────────────────────────
  pg-backup:
    image: prodrigestivill/postgres-backup-local:17
    container_name: legocitytimes-pg-backup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: legocitytimes
      POSTGRES_USER: legocity
      POSTGRES_PASSWORD: legocity
      POSTGRES_EXTRA_OPTS: "-Z6 --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 8080
    volumes:
      - pgbackups:/backups
    restart: unless-stopped

  # ── Anwendung ──────────────────────────────────────────────────────────────
  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    image: legocitytimes/content-service:latest
    container_name: legocitytimes-content-service
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legocitytimes
      SPRING_DATASOURCE_USERNAME: legocity
      SPRING_DATASOURCE_PASSWORD: legocity
      APP_IMAGE_UPLOAD_DIR: /app/uploads/images
      APP_SEARCH_SERVICE_URL: http://search-service:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: legocitytimes-nginx
    depends_on:
      - content-service
    ports:
      - "80:80"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: legocitytimes-nginx-exporter
    depends_on:
      - nginx
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    restart: unless-stopped

  # ── Container-Metriken ─────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: legocitytimes-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # ── PostgreSQL-Exporter ────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: legocitytimes-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://legocity:legocity@postgres:5432/legocitytimes?sslmode=disable"
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: legocitytimes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: legocitytimes-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.generated.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: legocitytimes-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/legocitytimes.json
    restart: unless-stopped


  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    image: legocitytimes/search-service:latest
    container_name: legocitytimes-search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: legocitytimes/frontend:latest
    container_name: legocitytimes-frontend
    depends_on:
      - content-service
      - search-service
    restart: unless-stopped



volumes:
  pgdata:   { name: legocitytimes-pgdata }
  pgbackups: { name: legocitytimes-pgbackups }
  uploads:  { name: legocitytimes-uploads }
  promdata: { name: legocitytimes-promdata }
  alertdata: { name: legocitytimes-alertdata }
  grafanadata: { name: legocitytimes-grafanadata }
  esdata: { name: legocitytimes-esdata }