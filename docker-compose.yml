services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    container_name: legocitytimes-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: legocitytimes-postgres
    environment:
      POSTGRES_DB: legocitytimes
      POSTGRES_USER: legocity
      POSTGRES_PASSWORD: legocity
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legocity -d legocitytimes"]
      interval: 10s
      timeout: 5s
      retries: 5

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    image: legocitytimes/content-service:latest
    container_name: legocitytimes-content-service
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legocitytimes
      SPRING_DATASOURCE_USERNAME: legocity
      SPRING_DATASOURCE_PASSWORD: legocity
      APP_IMAGE_UPLOAD_DIR: /app/uploads/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    image: legocitytimes/search-service:latest
    container_name: legocitytimes-search-service
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  esdata:
    name: legocitytimes-esdata
  pgdata:
    name: legocitytimes-pgdata
  uploads:
    name: legocitytimes-uploads
