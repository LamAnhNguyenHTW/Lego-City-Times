services:

  # ── Datenbank ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: legocitytimes-postgres
    environment:
      POSTGRES_DB: legocitytimes
      POSTGRES_USER: legocity
      POSTGRES_PASSWORD: legocity
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legocity -d legocitytimes"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Anwendung ──────────────────────────────────────────────────────────────
  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile
    image: legocitytimes/content-service:latest
    container_name: legocitytimes-content-service
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/legocitytimes
      SPRING_DATASOURCE_USERNAME: legocity
      SPRING_DATASOURCE_PASSWORD: legocity
      APP_IMAGE_UPLOAD_DIR: /app/uploads/images
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: legocitytimes-nginx
    depends_on:
      - content-service
    ports:
      - "80:80"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: legocitytimes-nginx-exporter
    depends_on:
      - nginx
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    restart: unless-stopped

  # ── Container-Metriken ─────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: legocitytimes-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  # ── PostgreSQL-Exporter ────────────────────────────────────────────────────
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: legocitytimes-postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: "postgresql://legocity:legocity@postgres:5432/legocitytimes?sslmode=disable"
    restart: unless-stopped

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: legocitytimes-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  # ── Alertmanager ───────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:latest
    container_name: legocitytimes-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertdata:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: legocitytimes-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/legocitytimes.json
    restart: unless-stopped

volumes:
  pgdata:   { name: legocitytimes-pgdata }
  uploads:  { name: legocitytimes-uploads }
  promdata: { name: legocitytimes-promdata }
  alertdata: { name: legocitytimes-alertdata }
  grafanadata: { name: legocitytimes-grafanadata }
