spring.application.name=content-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/legocitytimes
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=legocity
spring.datasource.password=legocity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Image Upload
app.image.upload-dir=uploads/images
app.image.max-size=10485760
app.image.allowed-types=image/jpeg,image/png,image/webp,image/gif

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

server.port=8080

# JWT — Secret muss in Produktion durch einen sicheren Wert ersetzt werden!
app.jwt.secret=bGVnb2NpdHl0aW1lc0p3dFNlY3JldEtleUZvckRldmVsb3BtZW50T25seTEyMzQ1Ng==
app.jwt.expiration=86400000

# Search Service integration
app.search-service.url=http://localhost:8081
